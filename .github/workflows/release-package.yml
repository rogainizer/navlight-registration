name: Release Package

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag name to create or update for this release, for example v1.0.0
        required: true
        type: string
      release_name:
        description: Release title shown on GitHub
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build release bundle
        shell: pwsh
        run: ./build-release.ps1 -Configuration Release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: navlight-release-win-x64
          path: dist/navlight-release-win-x64.zip

      - name: Attach ZIP to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_name || github.ref_name }}
          files: dist/navlight-release-win-x64.zip