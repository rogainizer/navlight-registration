name: Release Package

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag name to create or update for this release, for example 2.1
        required: true
        type: string
      release_name:
        description: Release title shown on GitHub
        required: true
        default: NavlightRegistration
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      # Version tag used in the asset file names, e.g. navlight-registration-2.1-win-x64.zip.
      # Comes from the manual tag_name input, or the pushed tag name on tag pushes.
      NAVLIGHT_RELEASE_VERSION: ${{ github.event.inputs.tag_name || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build release bundle
        shell: pwsh
        run: ./build-release.ps1 -Configuration Release

      - name: Build installer EXE
        shell: pwsh
        run: ./build-installer-exe.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: navlight-registration
          path: |
            dist/navlight-registration-*.zip
            dist/navreg-installer-*.exe

      - name: Attach ZIP to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_name || 'NavlightRegistration' }}
          files: |
            dist/navlight-registration-*.zip
            dist/navreg-installer-*.exe